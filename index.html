    <!-- Componente: perímetro de seguridad. Impide salir de la glorieta
         (los paneles de cierre están a ~70 m del centro). -->
    <script>
      AFRAME.registerComponent('limite-recorrido', {
        schema: { radio: {default: 66} },
        init: function () { this.pos = new THREE.Vector3(); },
        tick: function () { this.limitar(); },
        tock: function () { this.limitar(); },
        limitar: function () {
          var o = this.el.object3D;
          o.getWorldPosition(this.pos);
          var d = Math.sqrt(this.pos.x * this.pos.x + this.pos.z * this.pos.z);
          if (d <= this.data.radio) return;
          var k = this.data.radio / d;
          o.position.x -= this.pos.x * (1 - k);
          o.position.z -= this.pos.z * (1 - k);
        }
      });
    </script>

    <!-- Componente: saludo de Carmen al hacer clic (ratón o gatillo VR) -->
    <script>
      AFRAME.registerComponent('saludo-carmen', {
        schema: {
          gesto:  {default: 'Talk_with_Right_Hand_Open'},  // animación mientras habla
          reposo: {default: 'Wave_One_Hand'},              // animación normal
          fondo:  {default: 0.3}                           // volumen de la música mientras habla (0-1)
        },
        init: function () {
          this.hablando = false;
          this.el.addEventListener('click', () => this.saludar());
          this.el.addEventListener('sound-ended', () => this.terminar());
        },
        saludar: function () {
          if (this.hablando) return;
          const sonido = this.el.components.sound;
          if (!sonido || !sonido.loaded) return;
          this.hablando = true;
          this.bajarFondo(true);
          this.el.setAttribute('animation-mixer', {clip: this.data.gesto, loop: 'repeat', crossFadeDuration: 0.4});
          sonido.stopSound();
          sonido.playSound();
        },
        terminar: function () {
          this.hablando = false;
          this.bajarFondo(false);
          this.el.setAttribute('animation-mixer', {clip: this.data.reposo, loop: 'repeat', crossFadeDuration: 0.4});
        },
        bajarFondo: function (bajar) {
          document.querySelectorAll('a-sound').forEach(s => {
            const snd = s.components.sound;
            if (!snd) return;
            if (bajar) { this.volFondo = snd.data.volume; s.setAttribute('sound', 'volume', snd.data.volume * this.data.fondo); }
            else if (this.volFondo !== undefined) { s.setAttribute('sound', 'volume', this.volFondo); }
          });
        }
      });
    </script>
      <!-- ══ COLISIONES con los modelos (Puerta de Alcalá, Carmen, carteles) ══
         Cada obstáculo es un <a-entity colisionador> invisible (sin geometría, no gasta GPU).
         El componente "colisiones" va en lo que se mueve (rig o cámara) y empuja al visitante
         fuera de cualquier obstáculo. Funciona con joystick, teclado y caminando con gafas VR. -->
    <script>
      AFRAME.registerComponent('colisionador', {
        schema: {
          forma: {default: 'caja'},   // 'caja' o 'circulo'
          ancho: {default: 1},        // caja: medida en X local (m)
          fondo: {default: 1},        // caja: medida en Z local (m)
          radio: {default: 0.5},      // círculo
          alto:  {default: 40}        // altura del obstáculo (centrada en su posición)
        },
        init: function () { this.el.sceneEl.colisionadores = (this.el.sceneEl.colisionadores || []).concat(this); },
        remove: function () { var l = this.el.sceneEl.colisionadores || []; l.splice(l.indexOf(this), 1); }
      });

      AFRAME.registerComponent('colisiones', {
        schema: {
          radio:  {default: 0.35},   // "grosor" del visitante
          cuerpo: {default: 1.7}     // altura del cuerpo por debajo de los ojos
        },
        init: function () {
          this.cam = new THREE.Vector3();
          this.c = new THREE.Vector3();
        },
        tick: function () { this.resolver(); },
        tock: function () { this.resolver(); },
        resolver: function () {
          var lista = this.el.sceneEl.colisionadores;
          if (!lista || !lista.length) return;
          var camEl = this.el.hasAttribute('camera') ? this.el : this.el.querySelector('[camera]');
          if (!camEl) return;
          var R = this.data.radio, mover = this.el.object3D.position;
          for (var pasada = 0; pasada < 2; pasada++) {
            camEl.object3D.getWorldPosition(this.cam);
            var pieY = this.cam.y - this.data.cuerpo, cabezaY = this.cam.y + 0.1;
            for (var i = 0; i < lista.length; i++) {
              var col = lista[i], d = col.data, o = col.el.object3D;
              o.getWorldPosition(this.c);
              var mitadAlto = d.alto / 2;
              if (cabezaY < this.c.y - mitadAlto || pieY > this.c.y + mitadAlto) continue;
              var dx = this.cam.x - this.c.x, dz = this.cam.z - this.c.z, ex = 0, ez = 0;
              if (d.forma === 'circulo') {
                var r = d.radio + R, dist = Math.sqrt(dx * dx + dz * dz);
                if (dist >= r) continue;
                if (dist < 1e-4) { dx = 1; dist = 1; }
                ex = dx / dist * (r - dist); ez = dz / dist * (r - dist);
              } else {
                var yaw = o.rotation.y, cs = Math.cos(yaw), sn = Math.sin(yaw);
                var lx =  cs * dx - sn * dz, lz = sn * dx + cs * dz;      // a coordenadas locales
                var hx = d.ancho / 2 + R, hz = d.fondo / 2 + R;
                if (Math.abs(lx) >= hx || Math.abs(lz) >= hz) continue;
                var px = hx - Math.abs(lx), pz = hz - Math.abs(lz), mx = 0, mz = 0;
                if (px < pz) mx = (lx >= 0 ? 1 : -1) * px; else mz = (lz >= 0 ? 1 : -1) * pz;
                ex = cs * mx + sn * mz; ez = -sn * mx + cs * mz;            // de vuelta al mundo
              }
              mover.x += ex; mover.z += ez;
              this.cam.x += ex; this.cam.z += ez;
            }
          }
        }
      });
    </script>
