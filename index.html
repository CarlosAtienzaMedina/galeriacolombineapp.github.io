    <!-- Componente: perímetro de seguridad. Impide salir de la glorieta
         (los paneles de cierre están a ~70 m del centro). -->
    <script>
      AFRAME.registerComponent('limite-recorrido', {
        schema: { radio: {default: 66} },
        init: function () { this.pos = new THREE.Vector3(); },
        tick: function () { this.limitar(); },
        tock: function () { this.limitar(); },
        limitar: function () {
          var o = this.el.object3D;
          o.getWorldPosition(this.pos);
          var d = Math.sqrt(this.pos.x * this.pos.x + this.pos.z * this.pos.z);
          if (d <= this.data.radio) return;
          var k = this.data.radio / d;
          o.position.x -= this.pos.x * (1 - k);
          o.position.z -= this.pos.z * (1 - k);
        }
      });
    </script>

    <!-- Componente: carteles interactivos (clic → se iluminan y sale su cartela al lado) -->
    <script>
    /* ───────── Cartel interactivo ─────────
       Al activarse:
         · el cartel se ilumina con un marco de luz pulsante
         · aparece(n) su(s) cartela(s) junto al cartel, en el lado desde el que se mira
       Cartel: 3 × 4 m.  Cartela: 2,14 × 3 m (proporción real de las imágenes). */
    var CARTEL_ANCHO = 3, CARTEL_ALTO = 4;
    var CARTELA_ANCHO = 2.14;
    var COLOR_LUZ = '#FFC65D';
    var cartelActivo = null;

    AFRAME.registerComponent('cartel-interactivo', {
      schema: {
        cartelas: {type: 'array'},          // ids de las cartelas asociadas
        color:    {default: COLOR_LUZ},
        ancho:    {default: CARTEL_ANCHO},  // tamaño del cartel (m)
        alto:     {default: CARTEL_ALTO},
        lado:     {default: 1},             // 1 = cartela a la derecha, -1 = a la izquierda
        dy:       {default: -0.2}           // desnivel de la cartela respecto al centro del cartel
      },

      init: function () {
        this.activo = false;
        // En el ordenador se activa haciendo CLIC sobre el cartel.
        // (Se ignora un segundo clic inmediato: el cursor central y el del ratón
        //  pueden enviar el mismo clic a la vez.)
        var self0 = this; this.ultimoClic = 0;
        this.el.addEventListener('click', function () {
          var t = performance.now(); if (t - self0.ultimoClic < 350) return;
          self0.ultimoClic = t; self0.alternar();
        });
        this.marco = [];
        var w = this.data.ancho, h = this.data.alto, self = this;

        /* Dos capas: filo intenso + halo suave. Están FUERA del área del cartel,
           en su mismo plano, así se ven desde ambas caras sin tapar la imagen. */
        [[w * 0.04, 1.0], [w * 0.1, 0.3]].forEach(function (capa) {
          var t = capa[0], op = capa[1];
          var barras = [
            {x: 0,             y:  h / 2 + t / 2, w: w + 2 * t, h: t},  // arriba
            {x: 0,             y: -h / 2 - t / 2, w: w + 2 * t, h: t},  // abajo
            {x: -w / 2 - t / 2, y: 0,             w: t,         h: h},  // izquierda
            {x:  w / 2 + t / 2, y: 0,             w: t,         h: h}   // derecha
          ];
          barras.forEach(function (b) {
            var p = document.createElement('a-plane');
            p.setAttribute('width', b.w);
            p.setAttribute('height', b.h);
            p.setAttribute('position', b.x + ' ' + b.y + ' 0');
            p.setAttribute('material', {shader: 'flat', color: self.data.color, side: 'double',
                                        transparent: true, opacity: op, depthWrite: false});
            p.setAttribute('visible', false);
            p.dataset.opBase = op;
            self.el.appendChild(p);
            self.marco.push(p);
          });
        });
      },

      alternar: function () { this.activo ? this.desactivar() : this.activar(); },

      activar: function () {
        if (cartelActivo && cartelActivo !== this) cartelActivo.desactivar();
        cartelActivo = this;
        this.activo = true;
        this.marco.forEach(function (p) { p.setAttribute('visible', true); });
        this.colocarCartelas();
      },

      desactivar: function () {
        this.activo = false;
        if (cartelActivo === this) cartelActivo = null;
        this.marco.forEach(function (p) { p.setAttribute('visible', false); });
        this.data.cartelas.forEach(function (id) {
          var c = document.getElementById(id);
          if (c) c.setAttribute('visible', false);
        });
      },

      /* Coloca las cartelas junto al cartel, mirando hacia el visitante.
         1 cartela  → a la derecha del cartel.
         2 cartelas → una a cada lado. */
      colocarCartelas: function () {
        var obj = this.el.object3D;
        var pos = obj.getWorldPosition(new THREE.Vector3());
        var yaw = obj.rotation.y;

        /* ¿Desde qué cara se está mirando? */
        var cam = document.getElementById('camera').object3D.getWorldPosition(new THREE.Vector3());
        var normal = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
        var haciaCam = cam.clone().sub(pos);
        if (normal.dot(haciaCam) < 0) yaw += Math.PI;

        var q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        var datos = this.data;
        var lados = datos.cartelas.length > 1 ? [1, -1] : [datos.lado];

        this.data.cartelas.forEach(function (id, i) {
          var c = document.getElementById(id);
          if (!c) return;
          var anchoCartela = parseFloat(c.getAttribute('width')) || CARTELA_ANCHO;
          var lateral = datos.ancho / 2 + 0.3 + anchoCartela / 2;
          var off = new THREE.Vector3(lateral * lados[i % lados.length], datos.dy, 0.1).applyQuaternion(q);
          c.object3D.position.set(pos.x + off.x, pos.y + off.y, pos.z + off.z);
          c.object3D.rotation.set(0, yaw, 0);
          c.setAttribute('visible', true);
          c.emit('aparecer');
        });
      },

      tick: function (t) {
        if (!this.activo) return;
        // Si te alejas mucho, el cartel se apaga solo
        var camPos = document.getElementById('camera').object3D.getWorldPosition(new THREE.Vector3());
        if (camPos.distanceTo(this.el.object3D.getWorldPosition(new THREE.Vector3())) > 20) { this.desactivar(); return; }
        var k = 0.65 + 0.35 * Math.sin(t / 260);   // pulso suave
        this.marco.forEach(function (p) {
          var m = p.getObject3D('mesh');
          if (m) m.material.opacity = p.dataset.opBase * k;
        });
      }
    });

    </script>

    <!-- Componente: saludo de Carmen al hacer clic (ratón o gatillo VR) -->
    <script>
      AFRAME.registerComponent('saludo-carmen', {
        schema: {
          gesto:  {default: 'Talk_with_Right_Hand_Open'},  // animación mientras habla
          reposo: {default: 'Wave_One_Hand'},              // animación normal
          fondo:  {default: 0.3}                           // volumen de la música mientras habla (0-1)
        },
        init: function () {
          this.hablando = false;
          this.el.addEventListener('click', () => this.saludar());
          this.el.addEventListener('sound-ended', () => this.terminar());
        },
        saludar: function () {
          if (this.hablando) return;
          const sonido = this.el.components.sound;
          if (!sonido || !sonido.loaded) return;
          this.hablando = true;
          this.bajarFondo(true);
          this.el.setAttribute('animation-mixer', {clip: this.data.gesto, loop: 'repeat', crossFadeDuration: 0.4});
          sonido.stopSound();
          sonido.playSound();
        },
        terminar: function () {
          this.hablando = false;
          this.bajarFondo(false);
          this.el.setAttribute('animation-mixer', {clip: this.data.reposo, loop: 'repeat', crossFadeDuration: 0.4});
        },
        bajarFondo: function (bajar) {
          document.querySelectorAll('a-sound').forEach(s => {
            const snd = s.components.sound;
            if (!snd) return;
            if (bajar) { this.volFondo = snd.data.volume; s.setAttribute('sound', 'volume', snd.data.volume * this.data.fondo); }
            else if (this.volFondo !== undefined) { s.setAttribute('sound', 'volume', this.volFondo); }
          });
        }
      });
    </script>
      <!-- ══ COLISIONES con los modelos (Puerta de Alcalá, Carmen, carteles) ══
         Cada obstáculo es un <a-entity colisionador> invisible (sin geometría, no gasta GPU).
         El componente "colisiones" va en lo que se mueve (rig o cámara) y empuja al visitante
         fuera de cualquier obstáculo. Funciona con joystick, teclado y caminando con gafas VR. -->
    <script>
      AFRAME.registerComponent('colisionador', {
        schema: {
          forma: {default: 'caja'},   // 'caja', 'circulo' o 'auto' (toma forma y giro del propio cartel)
          ancho: {default: 1},        // caja: medida en X local (m)
          fondo: {default: 1},        // caja: medida en Z local (m)
          radio: {default: 0.5},      // círculo
          alto:  {default: 40}        // altura del obstáculo (centrada en su posición)
        },
        init: function () {
          this.el.sceneEl.colisionadores = (this.el.sceneEl.colisionadores || []).concat(this);
          this.p = new THREE.Vector3(); this.q = new THREE.Quaternion(); this.e = new THREE.Vector3();
          this.eu = new THREE.Euler(); this.c = new THREE.Vector3(); this.t = new THREE.Vector3();
        },
        /* Caja orientada en el mundo: {x,y,z, hx,hy,hz, yaw, circulo}. null si está oculto. */
        obb: function () {
          for (var o = this.el.object3D; o; o = o.parent) if (o.visible === false) return null;
          var d = this.data, r = this.r || (this.r = {});
          if (d.forma === 'auto') {
            var m = this.el.getObject3D('mesh');
            if (!m || !m.geometry) return null;
            var g = m.geometry; if (!g.boundingBox) g.computeBoundingBox();
            m.updateWorldMatrix(true, false);
            var me = m.matrixWorld.elements;
            // escala de cada eje = longitud de cada columna (funciona aunque una escala sea 0)
            var sx = Math.hypot(me[0], me[1], me[2]), sy = Math.hypot(me[4], me[5], me[6]), sz = Math.hypot(me[8], me[9], me[10]);
            g.boundingBox.getCenter(this.c).applyMatrix4(m.matrixWorld);
            g.boundingBox.getSize(this.t);
            r.x = this.c.x; r.y = this.c.y; r.z = this.c.z;
            r.hx = this.t.x * sx / 2; r.hy = this.t.y * sy / 2; r.hz = this.t.z * sz / 2;
            // giro alrededor de Y a partir del eje X local (o del Z si el X está aplastado)
            r.yaw = sx > 1e-6 ? Math.atan2(-me[2], me[0]) : Math.atan2(me[8], me[10]);
            r.circulo = false;
            if (!isFinite(r.x + r.y + r.z + r.hx + r.hy + r.hz + r.yaw)) return null;
            return r;
          }
          this.el.object3D.getWorldPosition(this.p);
          this.el.object3D.getWorldQuaternion(this.q);
          r.x = this.p.x; r.y = this.p.y; r.z = this.p.z; r.hy = d.alto / 2;
          r.yaw = this.eu.setFromQuaternion(this.q, 'YXZ').y;
          r.circulo = d.forma === 'circulo'; r.radio = d.radio;
          r.hx = d.ancho / 2; r.hz = d.fondo / 2;
          return r;
        },
        remove: function () { var l = this.el.sceneEl.colisionadores || []; l.splice(l.indexOf(this), 1); }
      });

      AFRAME.registerComponent('colisiones', {
        schema: {
          radio:  {default: 0.35},   // "grosor" del visitante
          cuerpo: {default: 1.7}     // altura del cuerpo por debajo de los ojos
        },
        init: function () {
          this.cam = new THREE.Vector3();
          this.c = new THREE.Vector3();
        },
        // Un fallo aquí nunca debe detener el dibujado de la escena
        tick: function () { try { this.resolver(); } catch (e) { if (!this.avisado) { this.avisado = true; console.warn('[colisiones] error ignorado:', e); } } },
        tock: function () { try { this.resolver(); } catch (e) { } },
        resolver: function () {
          var lista = this.el.sceneEl.colisionadores;
          if (!lista || !lista.length) return;
          var camEl = (this.el.components && this.el.components.camera) ? this.el : this.el.querySelector('[camera]');
          if (!camEl) return;
          var R = this.data.radio, mover = this.el.object3D.position;
          for (var pasada = 0; pasada < 2; pasada++) {
            camEl.object3D.getWorldPosition(this.cam);
            var pieY = this.cam.y - this.data.cuerpo, cabezaY = this.cam.y + 0.1;
            for (var i = 0; i < lista.length; i++) {
              var b = lista[i].obb();
              if (!b) continue;                                   // oculto (cartela cerrada, otro mundo…)
              if (cabezaY < b.y - b.hy || pieY > b.y + b.hy) continue;
              var dx = this.cam.x - b.x, dz = this.cam.z - b.z, ex = 0, ez = 0;
              if (b.circulo) {
                var r = b.radio + R, dist = Math.sqrt(dx * dx + dz * dz);
                if (dist >= r) continue;
                if (dist < 1e-4) { dx = 1; dist = 1; }
                ex = dx / dist * (r - dist); ez = dz / dist * (r - dist);
              } else {
                var yaw = b.yaw, cs = Math.cos(yaw), sn = Math.sin(yaw);
                var lx =  cs * dx - sn * dz, lz = sn * dx + cs * dz;      // a coordenadas locales
                var hx = b.hx + R, hz = b.hz + R;
                if (Math.abs(lx) >= hx || Math.abs(lz) >= hz) continue;
                var px = hx - Math.abs(lx), pz = hz - Math.abs(lz), mx = 0, mz = 0;
                if (px < pz) mx = (lx >= 0 ? 1 : -1) * px; else mz = (lz >= 0 ? 1 : -1) * pz;
                ex = cs * mx + sn * mz; ez = -sn * mx + cs * mz;            // de vuelta al mundo
              }
              if (!isFinite(ex) || !isFinite(ez)) continue;
              mover.x += ex; mover.z += ez;
              this.cam.x += ex; this.cam.z += ez;
            }
          }
        }
      });
    </script>
</head>

        cur.addEventListener('mouseenter', function () { if (escena.canvas) escena.canvas.style.cursor = 'pointer'; });
